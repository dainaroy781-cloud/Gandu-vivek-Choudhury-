<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beizzati Survivor - The Game</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        #game-container {
            background-color: #2d2d2d;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 90%;
            max-width: 500px;
        }
        h1 { color: #ff4757; }
        #meter-container {
            width: 100%;
            background-color: #444;
            height: 30px;
            border-radius: 15px;
            margin: 20px 0;
            overflow: hidden;
        }
        #beizzati-meter {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff9f43, #ff4757);
            transition: width 0.5s;
        }
        .dialogue-box {
            min-height: 80px;
            margin-bottom: 20px;
            font-style: italic;
            color: #ccc;
        }
        .options button {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            background-color: #5352ed;
            color: white;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.2s;
        }
        .options button:hover {
            background-color: #3742fa;
            transform: scale(1.02);
        }
        #status-msg { margin-top: 20px; font-weight: bold; color: #2ed573; }
    </style>
</head>
<body>

<div id="game-container">
    <h1>Beizzati Survivor 🎭</h1>
    <p>जीतने के लिए बेइज्जती सहना जरूरी है!</p>
    
    <div id="meter-container">
        <div id="beizzati-meter"></div>
    </div>
    <p>Beizzati Meter: <span id="meter-val">0</span>%</p>

    <hr>

    <div id="question-area">
        <div class="dialogue-box" id="npc-talk">
            पड़ोसी: "बेटा, सुना है फिर से फेल हो गए? शकल से तो तुम वैसे भी अनपढ़ लगते हो!"
        </div>
        <div class="options" id="options-box">
            <button onclick="handleChoice(1)">"जी अंकल, आपकी संगति का असर है!"</button>
            <button onclick="handleChoice(0)">"तमीज से बात कीजिए अंकल!"</button>
        </div>
    </div>

    <div id="status-msg"></div>
</div>

<script>
    let score = 0;
    let currentLevel = 0;

    const scenarios = [
        {
            npc: "पड़ोसी: 'बेटा, सुना है फिर से फेल हो गए? शकल से तो तुम वैसे भी अनपढ़ लगते हो!'",
            choices: [
                { text: "जी अंकल, आपकी संगति का असर है!", points: 25, msg: "शानदार! आपने बेइज्जती स्वीकार की।" },
                { text: "तमीज से बात कीजिए अंकल!", points: -10, msg: "अरे! गुस्सा क्यों? आप हार रहे हैं।" }
            ]
        },
        {
            npc: "बॉस: 'ये फाइल तुमने बनाई है? इससे अच्छी हैंडराइटिंग तो एक बंदर की होती है!'",
            choices: [
                { text: "सॉरी सर, अगली बार बंदर से ही बनवा लूँगा!", points: 25, msg: "गजब बेइज्जती है! पॉइंट्स मिले।" },
                { text: "मैंने बहुत मेहनत की है सर!", points: -15, msg: "मेहनत नहीं, बेइज्जती चाहिए!" }
            ]
        },
        {
            npc: "रिश्तेदार: 'तुम्हारी उम्र हो गई है, पर अक्ल अभी भी घुटनों में है!'",
            choices: [
                { text: "घुटनों में अक्ल है, इसीलिए तो आपसे झुककर बात करता हूँ!", points: 25, msg: "क्या जवाब दिया! मीटर बढ़ रहा है।" },
                { text: "आप अपना काम देखिए!", points: -20, msg: "गुस्सा किया तो गेम ओवर की तरफ बढ़ेंगे!" }
            ]
        },
        {
            npc: "दोस्त: 'भाई, तू पैदा हुआ था या बस कबाड़ में मिला था?'",
            choices: [
                { text: "कबाड़ में मिला था, इसीलिए तो तुझ जैसे कचरे से दोस्ती हुई!", points: 25, msg: "वाह! बेइज्जती के बादशाह!" },
                { text: "गाली मत दे भाई!", points: -10, msg: "इमोशनल मत बनो!" }
            ]
        }
    ];

    function handleChoice(index) {
        const choice = scenarios[currentLevel].choices[index];
        score += choice.points;
        if(score < 0) score = 0;
        if(score > 100) score = 100;

        document.getElementById('beizzati-meter').style.width = score + "%";
        document.getElementById('meter-val').innerText = score;
        document.getElementById('status-msg').innerText = choice.msg;

        currentLevel++;

        if (score >= 100) {
            document.getElementById('game-container').innerHTML = `
                <h1 style="color: #2ed573;">🏆 विजेता!</h1>
                <p>बधाई हो! आपने इतनी बेइज्जती सही कि अब आप 'निर्लज्ज' बन चुके हैं।</p>
                <button onclick="location.reload()" style="padding:10px 20px; cursor:pointer;">फिर से बेइज्जत होना है?</button>
            `;
        } else if (currentLevel >= scenarios.length) {
            document.getElementById('game-container').innerHTML = `
                <h1 style="color: #ff4757;">Game Over!</h1>
                <p>आप पर्याप्त बेइज्जती नहीं सह पाए। थोड़े और 'बेशरम' बनो!</p>
                <button onclick="location.reload()" style="padding:10px 20px; cursor:pointer;">फिर से कोशिश करें</button>
            `;
        } else {
            updateUI();
        }
    }

    function updateUI() {
        document.getElementById('npc-talk').innerText = scenarios[currentLevel].npc;
        const btns = document.querySelectorAll('.options button');
        btns[0].innerText = scenarios[currentLevel].choices[0].text;
        btns[1].innerText = scenarios[currentLevel].choices[1].text;
    }
</script>

</body>
</html>
